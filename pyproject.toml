[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "privatedataremover"
version = "0.2.0"
description = "Cross-platform desktop app to detect and mask personal data in PDFs"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "Private Data Remover Contributors" }]
keywords = ["privacy", "pdf", "pii", "redaction", "desktop"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: X11 Applications :: Qt",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]
dependencies = [
  "PySide6>=6.6",
  "pymupdf>=1.24",
  "pytesseract>=0.3.10",
  "httpx>=0.27",
  "Pillow>=10.0",
  "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-qt>=4.4",
  "ruff>=0.6",
]
packaging = [
  "pyinstaller>=6.0",
]
openai = ["openai>=1.40"]
anthropic = ["anthropic>=0.34"]
all = ["privatedataremover[dev,packaging,openai,anthropic]"]

[project.scripts]
privatedataremover = "privatedataremover.__main__:main"

[project.urls]
Homepage = "https://github.com/progh2/privatedataremover"
Documentation = "https://github.com/progh2/privatedataremover/blob/master/docs/PRD.md"
Issues = "https://github.com/progh2/privatedataremover/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
